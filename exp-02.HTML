<!DOCTYPE html>
<html>
<head>
    <title>Tourist Places in India</title>
    <style>
        body {
            font-family: Georgia, serif;
            text-align: center;
            background-color: white;
        }

        h1 {
            color: blue;
            font-size: 40px;
        }

        table {
            width: 85%;
            margin: auto;
            border-collapse: collapse;
        }

        td {
            border: 2px solid #cccccc;
            padding: 10px;
            width: 50%;
        }

        img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        h2 {
            color: darkgreen;
            margin: 5px;
            font-size: 25px;
        }
    </style>
</head>

<body>

    <h1>Tourist Places in India</h1>

    <table>
        <tr>
            <td>
                <img src="Indiagate.jpg"
                     alt="India Gate">
                <h2>India Gate</h2>
            </td>

            <td>
                <img src="Red Fort.jpg"
                     alt="Red Fort">
                <h2>Red Fort</h2>
            </td>
        </tr>

        <tr>
            <td>
                <img src="Qutub Minar.jpg"
                </h2>Qutub Minar</h2>
            </td>

            <td>
                <img src="Lotus Temple.jpg"
                     alt="Lotus Temple">
                <h2>Lotus Temple</h2>
            </td>
        </tr>
    </table>

</body>
</html>
